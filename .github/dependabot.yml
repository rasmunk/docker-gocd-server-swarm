version: 2
updates:
  - package-ecosystem: "docker"
    directory: "."
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "master"
    allow:
     - dependency-name: "production"
       update-types:
        - "version-update:semver-minor"
        - "version-update:semver-patch"
     - dependency-name: "development"
       update-types:
        - "version-update:semver-minor"
        - "version-update:semver-patch"
        - "version-update:semver-major"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"